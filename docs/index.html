<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b3fc4"><title>Classcard 자동화</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:system-ui,sans-serif}main{max-width:680px;min-height:100vh;margin:auto;padding:18px 15px;background:#fff}h1{font-size:23px;margin:3px 0 20px}label,b{display:block;margin:14px 0 7px}select,input{width:100%;height:46px;padding:0 10px;border:1px solid #ccd3dc;border-radius:6px;background:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:7px}.row span{text-align:center}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg.four{grid-template-columns:repeat(4,1fr)}.seg input{display:none}.seg label{margin:0;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #ccd3dc;border-radius:6px;font-weight:700}.seg input:checked+label{border-color:#5b3fc4;background:#f0edff;color:#5b3fc4}button{width:100%;height:50px;margin-top:22px;border:0;border-radius:6px;background:#5b3fc4;color:white;font-size:17px;font-weight:800}.hint{font-size:13px;color:#66717e;margin-top:10px}
</style></head><body><main><h1>Classcard 자동화</h1>
<b>클래스</b><select id="class"></select><b>세트</b><select id="set"></select>
<b>카드 범위</b><div class="row"><input id="start" type="number" min="1" value="1"><span>~</span><input id="end" type="number" min="1" value="24"></div>
<b>학습 종류</b><div class="seg"><input id="m1" name="mode" type="radio" value="1" checked><label for="m1">암기</label><input id="m2" name="mode" type="radio" value="2"><label for="m2">리콜</label><input id="m3" name="mode" type="radio" value="3"><label for="m3">스펠</label></div>
<b>목표</b><div class="seg four"><input id="a1" name="amount" type="radio" value="1" checked><label for="a1">100%</label><input id="a2" name="amount" type="radio" value="2"><label for="a2">200%</label><input id="a3" name="amount" type="radio" value="3"><label for="a3">300%</label><input id="a4" name="amount" type="radio" value="4"><label for="a4">400%</label></div>
<button id="run">실행 요청 만들기</button><div class="hint">GitHub 화면이 열리면 Create new issue를 한 번 누르면 시작됩니다.</div>
<script>
const countsInside=[[35,14,14],[35,18,15],[35,11,16],[35,14,15],[35,14,12],[35,14,13],[35,14,17],[35,17,15],[35,15,15],[35,22,15],[35,12,12],[35,14,13]];
const classes=[{id:'2046211',name:'중등필수 (능률VOCA)',sets:Array.from({length:50},(_,i)=>({id:String(25381006+i),name:`능률VOCA 중등 필수 DAY ${String(i+1).padStart(2,'0')}`,count:24}))},{id:'2059431',name:'Reading Inside Starter 1',sets:countsInside.flatMap((c,i)=>[{id:String(10159059+i),name:`Reading Inside Starter U${String(i+1).padStart(2,'0')}`,count:c[0]},{id:String(10513874+i*2),name:`U${String(i+1).padStart(2,'0')} Reading 1`,count:c[1]},{id:String(10513875+i*2),name:`U${String(i+1).padStart(2,'0')} Reading 2`,count:c[2]}])}];
const C=document.querySelector('#class'),S=document.querySelector('#set');classes.forEach((c,i)=>C.add(new Option(c.name,i)));function sync(){S.innerHTML='';classes[C.value].sets.forEach((s,i)=>S.add(new Option(`${s.name} · ${s.count}장`,i)));range()}function range(){const n=classes[C.value].sets[S.value].count;start.max=end.max=n;start.value=1;end.value=n}C.onchange=sync;S.onchange=range;sync();
run.onclick=()=>{const s=classes[C.value].sets[S.value],payload={class_id:classes[C.value].id,set_id:s.id,title:s.name,start:+start.value,end:+end.value,card_count:s.count,mode:+document.querySelector('[name=mode]:checked').value,amount:+document.querySelector('[name=amount]:checked').value};const raw=new TextEncoder().encode(JSON.stringify(payload));let str='';raw.forEach(x=>str+=String.fromCharCode(x));const token=btoa(str).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');const title=`[Classcard] ${s.name}`;const body=`CLASSCARD_PAYLOAD:${token}\n\n선택: ${s.name}\n카드: ${payload.start}~${payload.end}`;location.href=`https://github.com/pinde0000-art/classcard-free-runner/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`};
</script></main></body></html>
