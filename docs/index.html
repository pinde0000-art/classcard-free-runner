<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f4f6"><title>Classcard 자동화</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f2f4f6;--surface:#fff;--line:#e3e7eb;--line-strong:#d3d9df;
  --ink:#18202a;--ink-2:#3d4854;--muted:#6b7581;
  --accent:#12a06a;--accent-ink:#0c7c51;--accent-soft:#e8f6f0;
  --danger:#c0392f;--danger-soft:#fdecea;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
main{
  max-width:620px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:14px;
}
h1{font-size:20px;line-height:1.3;letter-spacing:-.01em;margin:0;font-weight:700}
.head{display:flex;flex-direction:column;gap:6px}
.status{font-size:13px;line-height:1.45;color:var(--muted);margin:0;word-break:keep-all}
.status.error{color:var(--danger)}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:16px;display:flex;flex-direction:column;gap:16px;
}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0}

select,input[type=number]{
  width:100%;max-width:100%;min-width:0;height:46px;padding:0 12px;
  border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);
  color:var(--ink);font-size:16px;font-family:inherit;
  text-overflow:ellipsis;-webkit-appearance:none;appearance:none;
}
select{
  padding-right:36px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7581' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:18px;
}
select:disabled,input:disabled{background:#f5f7f8;color:#9aa4ae;border-color:var(--line)}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

.range{display:grid;grid-template-columns:1fr 20px 1fr;align-items:center;gap:8px}
.dash{text-align:center;color:var(--muted);font-size:14px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#eef1f4;border-radius:8px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{
  min-height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-size:14px;font-weight:600;color:var(--ink-2);
  background:transparent;border:1px solid transparent;cursor:pointer;
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
  -webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap;
}
.seg input:checked+label{background:var(--surface);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(16,32,48,.06)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}

#run{
  width:100%;min-height:52px;margin:0;border:0;border-radius:8px;
  background:var(--ink);color:#fff;font-size:16px;font-weight:700;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  transition:background .18s var(--ease),opacity .18s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
#run:disabled{background:#c3cad1;color:#fff;cursor:default}
#run .ico{width:18px;height:18px;flex:none;display:block}
#run:disabled .ico{opacity:.85}

.progress{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px}
.progress.show{display:block}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;height:30px}
.chip{
  display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;
  font-size:12px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
  background:#eef1f4;color:var(--ink-2);
  transition:background .2s var(--ease),color .2s var(--ease);
}
.chip[data-state="preparing"]{background:#e9eff2;color:#41616e}
.chip[data-state="running"]{background:var(--accent-soft);color:var(--accent-ink)}
.chip[data-state="completed"]{background:var(--accent);color:#fff}
.chip[data-state="failed"]{background:var(--danger-soft);color:var(--danger)}
.count{
  font-size:22px;line-height:28px;height:28px;min-width:92px;text-align:right;
  font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  display:inline-block;transform-origin:100% 50%;
}
.count.bump{animation:countBump 640ms var(--ease)}
@keyframes countBump{0%{transform:scale(1)}22%{transform:scale(1.12)}100%{transform:scale(1)}}

.track{position:relative;height:8px;margin-top:12px;background:#e7ebee;border-radius:4px}
.fill{
  position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);
  background:var(--accent);border-radius:4px;will-change:transform;
  transition:transform 720ms var(--ease),background-color .25s var(--ease);
}
.glow{
  position:absolute;left:-14px;right:-14px;top:-20px;bottom:-20px;border-radius:8px;
  pointer-events:none;opacity:0;
  background:
    radial-gradient(58% 120% at 50% 50%,rgba(18,160,106,.34) 0%,rgba(18,160,106,.16) 52%,rgba(18,160,106,0) 82%),
    linear-gradient(90deg,rgba(18,160,106,0) 0%,rgba(18,160,106,.26) 22%,rgba(18,160,106,.34) 50%,rgba(18,160,106,.26) 78%,rgba(18,160,106,0) 100%);
  filter:blur(13px);
}
.glow.pulse{animation:glowOnce 700ms var(--ease) 1}
@keyframes glowOnce{0%{opacity:0}28%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .fill{transition:none}
  .glow,.glow.pulse{animation:none;opacity:0}
  .count.bump{animation:none}
  .seg label,#run,.chip{transition:none}
}
@media (min-width:700px){
  main{padding-top:36px;gap:16px}
  h1{font-size:22px}
}
</style></head><body><main>
<header class="head">
<h1>Classcard 자동화</h1>
<p id="status" class="status">클래스카드 목록을 불러오는 중입니다.</p>
</header>

<section class="panel">
<div class="field"><label class="lbl" for="class">클래스</label><select id="class" disabled></select></div>
<div class="field"><label class="lbl" for="set">세트</label><select id="set" disabled></select></div>
<div class="field"><span class="lbl">카드 범위</span><div class="range"><input id="start" type="number" min="1" value="1" inputmode="numeric"><span class="dash">~</span><input id="end" type="number" min="1" value="24" inputmode="numeric"></div></div>
<div class="field"><span class="lbl">학습 종류</span><div class="seg"><input id="m1" name="mode" type="radio" value="1" checked><label for="m1">암기</label><input id="m2" name="mode" type="radio" value="2"><label for="m2">리콜</label><input id="m3" name="mode" type="radio" value="3"><label for="m3">스펠</label><input id="m4" name="mode" type="radio" value="4"><label for="m4">테스트</label></div></div>
<div class="field"><span class="lbl">목표</span><div class="seg four"><input id="a1" name="amount" type="radio" value="1" checked><label for="a1">100%</label><input id="a2" name="amount" type="radio" value="2"><label for="a2">200%</label><input id="a3" name="amount" type="radio" value="3"><label for="a3">300%</label><input id="a4" name="amount" type="radio" value="4"><label for="a4">400%</label></div></div>
<button id="run" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5v15l12-7.5-12-7.5z" fill="currentColor" stroke="none"/></svg><span id="run-label">실행</span></button>
</section>

<section id="progress" class="progress">
<div class="prow"><span id="progress-state" class="chip" data-state="idle">대기 중</span><strong id="progress-count" class="count">0/0</strong></div>
<div class="track"><div id="progress-bar" class="fill"></div><div id="progress-glow" class="glow"></div></div>
</section>
<script>
const API_URL='https://classcard-free-runner.pinde0000.workers.dev/run',KEY_NAME='classcard_runner_key';
const hashKey=new URLSearchParams(location.hash.slice(1)).get('key');
const queryKey=new URLSearchParams(location.search).get('key');
const setupKey=hashKey||queryKey||'';
let savedKey='';
try{if(setupKey)localStorage.setItem(KEY_NAME,setupKey);savedKey=localStorage.getItem(KEY_NAME)||''}catch(error){}
if(hashKey)history.replaceState(null,'',location.pathname+location.search);
const runnerKey=setupKey||savedKey;let classes=[];const C=document.querySelector('#class'),S=document.querySelector('#set'),START=document.querySelector('#start'),END=document.querySelector('#end'),RUN=document.querySelector('#run'),RUN_LABEL=document.querySelector('#run-label'),STATUS=document.querySelector('#status');function sync(){S.innerHTML='';classes[C.value].sets.forEach((s,i)=>S.add(new Option(`${s.name}${s.count?` · ${s.count}장`:''}`,i)));range()}function range(){const n=classes[C.value].sets[S.value]?.count||0;if(n){START.max=END.max=n;START.value=1;END.value=n}else{START.removeAttribute('max');END.removeAttribute('max');START.value=1;END.value=1}const testMode=document.querySelector('#m4').checked;START.disabled=testMode;END.disabled=testMode}C.onchange=sync;S.onchange=range;document.querySelectorAll('[name=mode]').forEach(input=>input.onchange=()=>{range();if(input.value==='4'&&input.checked)STATUS.textContent='테스트는 클래스카드에 출제된 전체 문제로 실행됩니다.'});
const PROGRESS=document.querySelector('#progress'),PROGRESS_STATE=document.querySelector('#progress-state'),PROGRESS_COUNT=document.querySelector('#progress-count'),PROGRESS_BAR=document.querySelector('#progress-bar'),PROGRESS_GLOW=document.querySelector('#progress-glow');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));let shownDone=0,shownTotal=0,shownState='';
const STATE_LABEL={completed:'모두 완료',failed:'오류 발생',running:'학습 중',preparing:'학습 준비 중'};
function replay(element,className,duration){element.classList.remove(className);void element.offsetWidth;element.classList.add(className);setTimeout(()=>element.classList.remove(className),duration)}
function highlightStep(){replay(PROGRESS_GLOW,'pulse',760);replay(PROGRESS_COUNT,'bump',700)}
function renderProgress(done,total,state){PROGRESS.classList.add('show');PROGRESS_COUNT.textContent=`${done}/${total}`;PROGRESS_STATE.textContent=STATE_LABEL[state]||'대기 중';PROGRESS_STATE.dataset.state=STATE_LABEL[state]?state:'idle';PROGRESS_BAR.style.transform=`scaleX(${total?Math.min(1,done/total):0})`}
async function showProgress(progress,state){const parts=progress.split('/').map(Number),done=parts[0]||0,total=parts[1]||0;if(total!==shownTotal||done<shownDone){shownDone=0;shownTotal=total}if(!shownTotal)shownTotal=total;const stepped=done>shownDone;const finished=state==='completed'&&shownState!=='completed';shownDone=done;shownState=state;renderProgress(done,total,state);if(stepped||finished)highlightStep()}
function resetRunner(){shownDone=0;shownTotal=0;shownState='';PROGRESS.classList.remove('show');PROGRESS_GLOW.classList.remove('pulse');PROGRESS_COUNT.classList.remove('bump');PROGRESS_COUNT.textContent='0/0';PROGRESS_STATE.textContent='대기 중';PROGRESS_STATE.dataset.state='idle';PROGRESS_BAR.style.transform='scaleX(0)';document.querySelector('#m1').checked=true;document.querySelector('#a1').checked=true;range();RUN.disabled=false;RUN_LABEL.textContent='실행';const setCount=classes.reduce((sum,c)=>sum+c.sets.length,0);STATUS.textContent=`클래스 ${classes.length}개 · 세트 ${setCount}개 자동 불러오기 완료`;STATUS.classList.remove('error')}
async function watchProgress(id,total,initialIssue=0){let issue=initialIssue;for(let attempts=0;attempts<3600;attempts++){await wait(1000);try{const issuePart=issue?`&issue=${issue}`:'';const response=await fetch(`${API_URL.replace('/run','/status')}?id=${id}${issuePart}`,{headers:{Authorization:`Bearer ${runnerKey}`},cache:'no-store'});const data=await response.json();if(response.ok){if(data.issue)issue=data.issue;await showProgress(data.progress==='0/0'?`0/${total}`:data.progress,data.state);if(data.state==='completed'){STATUS.textContent='모두 완료되었습니다.';await wait(4000);resetRunner();return}if(data.state==='failed'){STATUS.textContent='실행이 중단되어 초기화합니다.';STATUS.classList.add('error');await wait(2500);resetRunner();return}}}catch(error){}}STATUS.textContent='진행 상황 확인 시간이 초과되어 초기화합니다.';STATUS.classList.add('error');await wait(2500);resetRunner()}
async function loadCatalog(){try{const response=await fetch(`./catalog.json?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();classes=data.classes||[];if(!classes.length)throw new Error('저장된 클래스가 없습니다.');C.innerHTML='';classes.forEach((c,i)=>C.add(new Option(c.name,i)));C.disabled=false;S.disabled=false;RUN.disabled=!runnerKey;sync();const setCount=classes.reduce((sum,c)=>sum+c.sets.length,0);STATUS.textContent=runnerKey?`클래스 ${classes.length}개 · 세트 ${setCount}개 자동 불러오기 완료`:'이 기기의 실행 설정이 필요합니다.';STATUS.classList.toggle('error',!runnerKey)}catch(error){STATUS.textContent=`목록을 불러오지 못했습니다: ${error.message}`;STATUS.classList.add('error')}}loadCatalog();
RUN.onclick=async()=>{const s=classes[C.value].sets[S.value],payload={class_id:classes[C.value].id,set_id:s.id,title:s.name,start:+START.value,end:+END.value,card_count:s.count,mode:+document.querySelector('[name=mode]:checked').value,amount:+document.querySelector('[name=amount]:checked').value};if(payload.start<1||payload.end<payload.start||payload.end>payload.card_count){STATUS.textContent='카드 범위를 확인해 주세요.';STATUS.classList.add('error');return}RUN.disabled=true;RUN_LABEL.textContent='실행 중';STATUS.textContent='학습을 빠르게 준비하고 있습니다.';STATUS.classList.remove('error');const selectedTotal=payload.end-payload.start+1;await showProgress(`0/${selectedTotal}`,'preparing');try{const response=await fetch(API_URL,{method:'POST',headers:{Authorization:`Bearer ${runnerKey}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);STATUS.textContent=data.message||'학습을 시작했습니다.';await showProgress(`0/${selectedTotal}`,'preparing');watchProgress(data.id,selectedTotal,data.issue||0)}catch(error){STATUS.textContent=`학습 실행에 실패했습니다: ${error.message}`;STATUS.classList.add('error');RUN.disabled=false;RUN_LABEL.textContent='실행'}};
</script></main></body></html>
