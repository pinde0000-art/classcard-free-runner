<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070B16"><meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-title" content="CLJ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>CLJ</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./app.css?v=atelier-1">
</head><body>

<!-- 테마 색을 따라 흐르는 조명과 궤도. 모든 배경 요소는 순수 장식이다. -->
<div class="ambient" aria-hidden="true">
<span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span>
<span class="ambient-orbit orbit-a"></span><span class="ambient-orbit orbit-b"></span>
<span class="noise"></span>
</div>

<!-- 넓은 화면 전용 글래스 레일. 좁은 화면에서는 실행 화면 상단 툴바가 같은 역할을 한다. -->
<aside class="rail" aria-label="주요 메뉴">
<span class="rail-brand" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5L12 3z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17.5 12 22l9-4.5"/></svg></span>
<nav class="rail-nav">
<button type="button" class="rail-item" id="rail-accounts" data-tip="계정" aria-label="계정 선택"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5A3.5 3.5 0 0 0 12.5 15h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.4"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.6 4.6a3.4 3.4 0 0 1 0 6.6"/></svg></button>
<button type="button" class="rail-item" id="rail-runner" data-tip="학습 실행" aria-label="학습 실행"><svg viewBox="0 0 24 24"><path d="M7 5.2v13.6L18.5 12 7 5.2z"/></svg></button>
</nav>
<span class="rail-sep" aria-hidden="true"></span>
<button type="button" class="rail-item" id="rail-refresh" data-tip="목록 새로고침" aria-label="목록 새로고침"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></button>
</aside>

<main>

<section class="screen" id="screen-accounts">
<header class="head">
<div class="brand-lockup">
<span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5L12 3z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17.5 12 22l9-4.5"/></svg></span>
<div>
<h1>CLJ</h1>
<p class="brand-tag">Classcard Runner</p>
</div></div>
<div class="welcome-copy"><h2>학습을<br>시작할까요?</h2><p>나만의 테마, 나의 학습 공간.</p></div>
<div class="mascot" aria-hidden="true">
<span class="mascot-aura"></span><span class="mascot-orbit"></span>
<img class="theme-mascot theme-dragon" src="./dragon.png" alt="" width="750" height="760" decoding="async">
<img class="theme-mascot theme-chocolate" src="./chocolate-duo.png" alt="" width="1536" height="1024" decoding="async">
<img class="theme-mascot theme-candy" src="./candy-duo.png" alt="" width="1536" height="1024" decoding="async">
</div>
</header>
<fieldset class="theme-picker" aria-label="테마 선택">
<legend>화면 테마</legend><div class="theme-options">
<input id="theme-dragon" name="theme" type="radio" value="dragon" checked><label for="theme-dragon" class="theme-card dragon-card"><span class="theme-preview" aria-hidden="true"><img src="./dragon.png" alt="" width="750" height="760" decoding="async"></span><span class="theme-caption"><b>드래곤</b><i class="theme-check" aria-hidden="true"></i></span></label>
<input id="theme-chocolate" name="theme" type="radio" value="chocolate"><label for="theme-chocolate" class="theme-card chocolate-card"><span class="theme-preview" aria-hidden="true"><img src="./chocolate-duo.png" alt="" width="1536" height="1024" decoding="async"></span><span class="theme-caption"><b>초콜릿</b><i class="theme-check" aria-hidden="true"></i></span></label>
<input id="theme-candy" name="theme" type="radio" value="candy"><label for="theme-candy" class="theme-card candy-card"><span class="theme-preview" aria-hidden="true"><img src="./candy-duo.png" alt="" width="1536" height="1024" decoding="async"></span><span class="theme-caption"><b>사탕</b><i class="theme-check" aria-hidden="true"></i></span></label>
</div></fieldset>
<section class="account-space" aria-labelledby="account-heading">
<div class="section-heading"><h2 id="account-heading">내 계정</h2><p id="account-status" class="status" role="status">계정을 불러오는 중입니다.</p></div>
<div class="acct-list" id="account-list"></div>
<div class="account-actions">
<button type="button" class="btn ghost" id="account-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>계정 추가</button>
<button type="button" class="btn primary" id="account-continue" disabled>이 계정으로 계속<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
</div></section>
</section>

<section class="screen" id="screen-runner" hidden>
<div class="runner-head">
<button type="button" class="icon-btn" id="account-back" aria-label="계정 선택으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<span class="runner-who"><span class="avatar sm" id="runner-avatar"></span><b id="runner-nickname"></b></span>
<button type="button" class="icon-btn" id="catalog-refresh" aria-label="목록 새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></button>
</div>
<div class="runner-intro"><div><span class="eyebrow">Classcard Runner</span><h2>학습 설정</h2></div><p id="status" class="status" role="status"></p></div>

<section class="panel" id="runner-panel">
<!-- 패널 우측 위의 기존 캐릭터. 실행 로직이 참조하는 요소와 상태는 유지한다. -->
<div class="dragon-perch" id="dragon-perch" data-state="perched" aria-hidden="true">
<span class="dragon-glow"></span>
<img class="dp dp-1" src="./dragon-a.png" alt="" width="279" height="300" decoding="async" fetchpriority="low">
<img class="dp dp-2" src="./dragon-b.png" alt="" width="302" height="300" decoding="async" fetchpriority="low">
<img class="theme-duo theme-chocolate" src="./chocolate-duo.png" alt="" width="1536" height="1024" decoding="async" fetchpriority="low">
<img class="theme-duo theme-candy" src="./candy-duo.png" alt="" width="1536" height="1024" decoding="async" fetchpriority="low">
</div>
<div class="field">
<span class="lbl" id="lbl-class"><span class="field-index" aria-hidden="true">01</span>클래스</span>
<select id="class" class="sr-only" tabindex="-1" aria-hidden="true" disabled></select>
<button type="button" class="picker" id="class-picker" aria-labelledby="lbl-class class-value" disabled>
<span class="picker-badge" id="class-badge">–</span>
<span class="picker-body"><span class="picker-value" id="class-value">클래스</span></span>
<span class="picker-meta" id="class-meta"></span>
<svg class="picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
</button>
</div>
<div class="field">
<span class="lbl" id="lbl-set"><span class="field-index" aria-hidden="true">02</span>세트</span>
<select id="set" class="sr-only" tabindex="-1" aria-hidden="true" disabled></select>
<button type="button" class="picker" id="set-picker" aria-labelledby="lbl-set set-value" disabled>
<span class="picker-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17.5 12 22l9-4.5"/></svg></span>
<span class="picker-body"><span class="picker-value" id="set-value">세트</span></span>
<span class="picker-meta" id="set-meta"></span>
<svg class="picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
</button>
</div>
<div class="field"><span class="lbl"><span class="field-index" aria-hidden="true">03</span>카드 범위</span><div class="range"><label class="range-cell"><span>시작</span><input id="start" type="number" min="1" value="1" inputmode="numeric" aria-label="시작 카드"></label><span class="dash" aria-hidden="true">~</span><label class="range-cell"><span>마지막</span><input id="end" type="number" min="1" value="24" inputmode="numeric" aria-label="마지막 카드"></label></div></div>
<div class="field"><span class="lbl"><span class="field-index" aria-hidden="true">04</span>학습 종류</span>
<div class="seg" id="mode-seg" role="radiogroup" aria-label="학습 종류">
<span class="seg-ind" id="mode-ind" aria-hidden="true"></span>
<input id="m1" name="mode" type="radio" value="1" checked><label for="m1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5h-5A1.5 1.5 0 0 1 4 16V5.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5h5A1.5 1.5 0 0 0 20 16V5.5z"/></svg>암기</label>
<input id="m2" name="mode" type="radio" value="2"><label for="m2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 0 1 14.5-6"/><path d="M20.5 12A8.5 8.5 0 0 1 6 18"/><path d="M18 3v3.5h-3.5"/><path d="M6 21v-3.5h3.5"/></svg>리콜</label>
<input id="m3" name="mode" type="radio" value="3"><label for="m3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 18 5.5-12h3L19 18"/><path d="M7.5 13.5h9"/></svg>스펠</label>
<input id="m4" name="mode" type="radio" value="4"><label for="m4"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 6H6.5A1.5 1.5 0 0 0 5 7.5v12A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-12A1.5 1.5 0 0 0 17.5 6H16"/><path d="m9 13.5 2 2 4-4"/></svg>테스트</label>
</div></div>
<div class="field"><span class="lbl"><span class="field-index" aria-hidden="true">05</span>목표</span>
<div class="seg plain" id="amount-seg" role="radiogroup" aria-label="목표">
<span class="seg-ind" id="amount-ind" aria-hidden="true"></span>
<input id="a1" name="amount" type="radio" value="1" checked><label for="a1">100%</label>
<input id="a2" name="amount" type="radio" value="2"><label for="a2">200%</label>
<input id="a3" name="amount" type="radio" value="3"><label for="a3">300%</label>
<input id="a4" name="amount" type="radio" value="4"><label for="a4">400%</label>
</div></div>
<button id="run" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4.5v15l12-7.5-12-7.5z" fill="currentColor"/></svg><span id="run-label">실행</span></button>
</section>

<section id="progress" class="progress">
<div class="prow">
<div class="pmeta"><span class="eyebrow">학습 진행</span><span id="progress-state" class="chip" data-state="idle">대기 중</span></div>
<div class="pnums"><strong id="progress-pct" class="pct"><span>0</span><i>%</i></strong><strong id="progress-count" class="count">0/0</strong></div>
</div>
<div class="track"><div id="progress-bar" class="fill"></div><div id="progress-glow" class="glow"></div></div>
</section>

<!-- 실행 연출: 두 용이 동시에 쏜 구슬이 아래에서 부딪혀 터진다. 순수 장식. -->
<div class="fx" id="run-fx" aria-hidden="true">
<span class="fx-orb fx-l"><i></i></span>
<span class="fx-orb fx-r"><i></i></span>
<span class="fx-burst"><i class="fx-flash"></i><i class="fx-ring"></i><i class="fx-ring fx-ring2"></i></span>
</div>
</section>
</main>

<div class="sheet" id="sheet" hidden>
<div class="sheet-backdrop" data-close></div>
<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="선택">
<div class="sheet-handle"></div>
<div class="sheet-search-wrap" id="sheet-search-wrap" hidden><input id="sheet-search" type="search" autocomplete="off" enterkeyhint="search" placeholder="검색"></div>
<div class="sheet-list" id="sheet-list"></div>
</div></div>

<div class="sheet as-dialog" id="account-sheet" hidden>
<div class="sheet-backdrop" data-close></div>
<div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="account-sheet-title">
<div class="sheet-handle"></div>
<h2 class="sheet-title" id="account-sheet-title">계정 추가</h2>
<form class="sheet-form" id="account-form" autocomplete="on">
<div class="field"><label class="lbl" for="login-id">클래스카드 아이디</label>
<input id="login-id" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required></div>
<div class="field"><label class="lbl" for="login-pw">비밀번호</label>
<div class="pw-wrap"><input id="login-pw" type="password" autocomplete="current-password" enterkeyhint="go" required>
<button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 표시" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<p class="form-error" id="account-error" role="alert"></p>
<div class="form-actions">
<button type="button" class="btn ghost" id="account-cancel">취소</button>
<button type="submit" class="btn primary" id="account-submit">연결</button>
</div>
</form>
</div></div>

<div class="sheet as-dialog" id="confirm-sheet" hidden>
<div class="sheet-backdrop" data-close></div>
<div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
<div class="sheet-handle"></div>
<h2 class="sheet-title" id="confirm-title">계정 삭제</h2>
<div class="sheet-form">
<p class="status" id="confirm-text" style="text-align:left"></p>
<div class="form-actions">
<button type="button" class="btn ghost" id="confirm-cancel">취소</button>
<button type="button" class="btn danger" id="confirm-ok">삭제</button>
</div></div>
</div></div>

<script src="./app.js?v=themes-2"></script>
</body></html>
