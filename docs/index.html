<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b3fc4"><title>Classcard 자동화</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:system-ui,sans-serif}main{max-width:680px;min-height:100vh;margin:auto;padding:18px 15px;background:#fff}h1{font-size:23px;margin:3px 0 8px}label,b{display:block;margin:14px 0 7px}select,input{width:100%;height:46px;padding:0 10px;border:1px solid #ccd3dc;border-radius:6px;background:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:7px}.row span{text-align:center}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seg.four{grid-template-columns:repeat(4,1fr)}.seg input{display:none}.seg label{margin:0;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #ccd3dc;border-radius:6px;font-weight:700}.seg input:checked+label{border-color:#5b3fc4;background:#f0edff;color:#5b3fc4}button{width:100%;height:50px;margin-top:22px;border:0;border-radius:6px;background:#5b3fc4;color:white;font-size:17px;font-weight:800}button:disabled{background:#aeb5bf}.hint,.status{font-size:13px;color:#66717e;margin-top:10px}.status{margin:0 0 18px}.error{color:#b42318}.progress{display:none;margin-top:18px;padding:14px;border:1px solid #d8dde5;border-radius:6px}.progress.show{display:block}.progress strong{font-size:24px}.track{height:8px;margin-top:10px;background:#e8ebef;border-radius:4px;overflow:hidden}.bar{height:100%;width:0;background:#5b3fc4;transition:width .25s}
</style></head><body><main><h1>Classcard 자동화</h1>
<div id="status" class="status">클래스카드 목록을 불러오는 중입니다.</div>
<b>클래스</b><select id="class" disabled></select><b>세트</b><select id="set" disabled></select>
<b>카드 범위</b><div class="row"><input id="start" type="number" min="1" value="1"><span>~</span><input id="end" type="number" min="1" value="24"></div>
<b>학습 종류</b><div class="seg"><input id="m1" name="mode" type="radio" value="1" checked><label for="m1">암기</label><input id="m2" name="mode" type="radio" value="2"><label for="m2">리콜</label><input id="m3" name="mode" type="radio" value="3"><label for="m3">스펠</label><input id="m4" name="mode" type="radio" value="4"><label for="m4">테스트</label></div>
<b>목표</b><div class="seg four"><input id="a1" name="amount" type="radio" value="1" checked><label for="a1">100%</label><input id="a2" name="amount" type="radio" value="2"><label for="a2">200%</label><input id="a3" name="amount" type="radio" value="3"><label for="a3">300%</label><input id="a4" name="amount" type="radio" value="4"><label for="a4">400%</label></div>
<button id="run" disabled>실행</button><div class="hint">버튼을 누르면 클라우드에서 바로 학습이 시작됩니다.</div><div id="progress" class="progress"><span id="progress-state">대기 중</span><br><strong id="progress-count">0/0</strong><div class="track"><div id="progress-bar" class="bar"></div></div></div>
<script>
const API_URL='https://classcard-free-runner.pinde0000.workers.dev/run',KEY_NAME='classcard_runner_key';
const hashKey=new URLSearchParams(location.hash.slice(1)).get('key');
const queryKey=new URLSearchParams(location.search).get('key');
const setupKey=hashKey||queryKey||'';
let savedKey='';
try{if(setupKey)localStorage.setItem(KEY_NAME,setupKey);savedKey=localStorage.getItem(KEY_NAME)||''}catch(error){}
if(hashKey)history.replaceState(null,'',location.pathname+location.search);
const runnerKey=setupKey||savedKey;let classes=[];const C=document.querySelector('#class'),S=document.querySelector('#set'),START=document.querySelector('#start'),END=document.querySelector('#end'),RUN=document.querySelector('#run'),STATUS=document.querySelector('#status');function sync(){S.innerHTML='';classes[C.value].sets.forEach((s,i)=>S.add(new Option(`${s.name}${s.count?` · ${s.count}장`:''}`,i)));range()}function range(){const n=classes[C.value].sets[S.value]?.count||0;if(n){START.max=END.max=n;START.value=1;END.value=n}else{START.removeAttribute('max');END.removeAttribute('max');START.value=1;END.value=1}const testMode=document.querySelector('#m4').checked;START.disabled=testMode;END.disabled=testMode}C.onchange=sync;S.onchange=range;document.querySelectorAll('[name=mode]').forEach(input=>input.onchange=()=>{range();if(input.value==='4'&&input.checked)STATUS.textContent='테스트는 클래스카드에 출제된 전체 문제로 실행됩니다.'});
const PROGRESS=document.querySelector('#progress'),PROGRESS_STATE=document.querySelector('#progress-state'),PROGRESS_COUNT=document.querySelector('#progress-count'),PROGRESS_BAR=document.querySelector('#progress-bar');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));let shownDone=0,shownTotal=0;
function renderProgress(done,total,state){PROGRESS.classList.add('show');PROGRESS_COUNT.textContent=`${done}/${total}`;PROGRESS_STATE.textContent=state==='completed'?'모두 완료':state==='failed'?'오류 발생':state==='running'?'학습 중':state==='preparing'?'학습 준비 중':'대기 중';PROGRESS_BAR.style.width=total?`${Math.min(100,done/total*100)}%`:'0%'}
async function showProgress(progress,state){const parts=progress.split('/').map(Number),done=parts[0]||0,total=parts[1]||0;if(total!==shownTotal||done<shownDone){shownDone=0;shownTotal=total}if(!shownTotal)shownTotal=total;while(shownDone<done){shownDone++;renderProgress(shownDone,total,state==='failed'?'failed':'running');await wait(120)}renderProgress(shownDone,total,state)}
function resetRunner(){shownDone=0;shownTotal=0;PROGRESS.classList.remove('show');PROGRESS_COUNT.textContent='0/0';PROGRESS_STATE.textContent='대기 중';PROGRESS_BAR.style.width='0%';document.querySelector('#m1').checked=true;document.querySelector('#a1').checked=true;range();RUN.disabled=false;const setCount=classes.reduce((sum,c)=>sum+c.sets.length,0);STATUS.textContent=`클래스 ${classes.length}개 · 세트 ${setCount}개 자동 불러오기 완료`;STATUS.classList.remove('error')}
async function watchProgress(id,total,initialIssue=0){let issue=initialIssue;for(let attempts=0;attempts<3600;attempts++){await wait(1000);try{const issuePart=issue?`&issue=${issue}`:'';const response=await fetch(`${API_URL.replace('/run','/status')}?id=${id}${issuePart}`,{headers:{Authorization:`Bearer ${runnerKey}`},cache:'no-store'});const data=await response.json();if(response.ok){if(data.issue)issue=data.issue;await showProgress(data.progress==='0/0'?`0/${total}`:data.progress,data.state);if(data.state==='completed'){STATUS.textContent='모두 완료되었습니다.';await wait(4000);resetRunner();return}if(data.state==='failed'){STATUS.textContent='실행이 중단되어 초기화합니다.';STATUS.classList.add('error');await wait(2500);resetRunner();return}}}catch(error){}}STATUS.textContent='진행 상황 확인 시간이 초과되어 초기화합니다.';STATUS.classList.add('error');await wait(2500);resetRunner()}
async function loadCatalog(){try{const response=await fetch(`./catalog.json?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();classes=data.classes||[];if(!classes.length)throw new Error('저장된 클래스가 없습니다.');C.innerHTML='';classes.forEach((c,i)=>C.add(new Option(c.name,i)));C.disabled=false;S.disabled=false;RUN.disabled=!runnerKey;sync();const setCount=classes.reduce((sum,c)=>sum+c.sets.length,0);STATUS.textContent=runnerKey?`클래스 ${classes.length}개 · 세트 ${setCount}개 자동 불러오기 완료`:'이 기기의 실행 설정이 필요합니다.';STATUS.classList.toggle('error',!runnerKey)}catch(error){STATUS.textContent=`목록을 불러오지 못했습니다: ${error.message}`;STATUS.classList.add('error')}}loadCatalog();
RUN.onclick=async()=>{const s=classes[C.value].sets[S.value],payload={class_id:classes[C.value].id,set_id:s.id,title:s.name,start:+START.value,end:+END.value,card_count:s.count,mode:+document.querySelector('[name=mode]:checked').value,amount:+document.querySelector('[name=amount]:checked').value};if(payload.start<1||payload.end<payload.start||payload.end>payload.card_count){STATUS.textContent='카드 범위를 확인해 주세요.';STATUS.classList.add('error');return}RUN.disabled=true;STATUS.textContent='학습을 빠르게 준비하고 있습니다.';STATUS.classList.remove('error');const selectedTotal=payload.end-payload.start+1;await showProgress(`0/${selectedTotal}`,'preparing');try{const response=await fetch(API_URL,{method:'POST',headers:{Authorization:`Bearer ${runnerKey}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);STATUS.textContent=data.message||'학습을 시작했습니다.';await showProgress(`0/${selectedTotal}`,'preparing');watchProgress(data.id,selectedTotal,data.issue||0)}catch(error){STATUS.textContent=`학습 실행에 실패했습니다: ${error.message}`;STATUS.classList.add('error');RUN.disabled=false}};
</script></main></body></html>
