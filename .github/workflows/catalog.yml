name: 클래스·세트 목록 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: classcard-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLASSCARD_ID: ${{ secrets.CLASSCARD_ID }}
      CLASSCARD_PASSWORD: ${{ secrets.CLASSCARD_PASSWORD }}
      CLASSCARD_NONINTERACTIVE: "1"
      CLASSCARD_HEADLESS: "1"
      CLASSCARD_DATA_DIR: /tmp/classcard
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 클래스·세트 목록 읽기
        run: python -u export_catalog.py
      - name: 변경된 목록 게시
        run: |
          if git diff --quiet -- docs/catalog.json; then
            echo "목록 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          git commit -m "Update Classcard catalog"
          git push
