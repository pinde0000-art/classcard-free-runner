name: Classcard 실행

on:
  workflow_dispatch:
    inputs:
      class_id: {description: "클래스 번호", required: true}
      set_id: {description: "세트 번호", required: true}
      title: {description: "세트 이름", required: false, default: "Classcard"}
      start: {description: "시작 카드", required: true, default: "1"}
      end: {description: "마지막 카드", required: true, default: "24"}
      card_count: {description: "전체 카드 수", required: true, default: "24"}
      mode: {description: "1 암기, 2 리콜, 3 스펠", required: true, default: "1"}
      amount: {description: "1=100%, 2=200%, 3=300%, 4=400%", required: true, default: "1"}
      request_id: {description: "진행 상황 번호", required: false, default: ""}
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: classcard-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Classcard]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      INPUT_CLASS_ID: ${{ inputs.class_id }}
      INPUT_SET_ID: ${{ inputs.set_id }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_START: ${{ inputs.start }}
      INPUT_END: ${{ inputs.end }}
      INPUT_CARD_COUNT: ${{ inputs.card_count }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_AMOUNT: ${{ inputs.amount }}
      CLASSCARD_ID: ${{ secrets.CLASSCARD_ID }}
      CLASSCARD_PASSWORD: ${{ secrets.CLASSCARD_PASSWORD }}
      CLASSCARD_NONINTERACTIVE: "1"
      CLASSCARD_HEADLESS: "1"
      CLASSCARD_DATA_DIR: /tmp/classcard
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_PROGRESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPOSITORY: ${{ github.repository }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 진행 상황 준비
        id: progress_issue
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const total = Number('${{ inputs.end }}') - Number('${{ inputs.start }}') + 1;
            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `[Classcard status] ${{ inputs.request_id }}`,
              body: `CLASSCARD_PROGRESS:0/${total}\nCLASSCARD_STATUS:queued`
            });
            core.setOutput('number', issue.data.number);
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt
      - name: 클래스카드 자동화
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || steps.progress_issue.outputs.number }}
        run: python -u action_payload.py
      - name: 결과 남기기
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: ok ? '자동화가 완료되었습니다.' : `자동화 중 오류가 발생했습니다. [실행 기록 확인](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed'});
